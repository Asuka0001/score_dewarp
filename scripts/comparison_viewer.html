<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乐谱校正 · 同页对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#17212e;font:15px/1.65 system-ui,sans-serif}
header{padding:22px 28px;background:#fff;border-bottom:1px solid #dbe2e9}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0;color:#536274}
.controls{position:sticky;top:0;z-index:2;background:#fff;padding:12px 24px;border-bottom:1px solid #ccd6df;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;padding:6px 12px;border:1px solid #bbc8d5;border-radius:6px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#eef5fb}select{max-width:260px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 24px}.panel{min-width:0;background:white;border:1px solid #d4dee8;border-radius:8px;overflow:hidden}.panel h2{font-size:17px;margin:0;padding:12px 16px;border-bottom:1px solid #e2e8ee}
.viewport{height:72vh;overflow:auto;background:#dfe5eb;padding:10px}.viewport img{display:block;width:100%;max-width:none;background:white}.links{padding:8px 15px}.metric{font-size:13px;padding:0 15px 10px;color:#526274}
.note{margin:0 24px 18px;padding:12px 16px;background:#fff8e8;border:1px solid #e9d7a8;border-radius:8px}.review{padding:10px 24px 24px}a{color:#1668a5}.small{font-size:13px}.selected{background:#d9edfc;border-color:#408bbf}.hidden{display:none}
@media(max-width:760px){.pairs{padding:10px;gap:8px}.controls{padding:8px}header{padding:16px}.viewport{height:62vh;padding:3px}.panel h2{font-size:14px;padding:8px}select{max-width:180px}}
</style>
<header>
<h1>乐谱校正 · 同页对照</h1>
<p>全部 60 页、7 个方案。先看同位置局部的线条和音符，再看整页的标题、页码与谱行保留。</p>
<p class="small">局部以相同原图位置为锚点，按线距等比放大至 24px；没有额外旋转或非等比拉伸。整页沿用各方案实际输出画布，不拉成统一宽高比。</p>
</header>
<div class="controls">
<button id="prev" aria-label="上一页">← 上一页</button><select id="sample" aria-label="选择照片"></select><button id="next">下一页 →</button>
<select id="filter" aria-label="样本筛选"><option value="all">全部 60 页</option><option value="selected">建议检查的样本</option><option value="worst">结构方案退化/差异最小优先</option><option value="largest">结构改善幅度最大优先</option><option value="margin">边缘保留差异最大优先</option></select>
<select id="mode" aria-label="显示内容"><option value="crop">同位置局部放大</option><option value="full">整页实际输出</option></select>
<label>放大 <input id="zoom" type="range" min="100" max="250" step="25" value="100" aria-label="缩放比例"></label>
<label><input id="sync" type="checkbox" checked> 同步滚动</label><label><input id="metrics" type="checkbox"> 显示指标</label>
</div>
<div class="pairs">
<section class="panel"><h2>左：<select id="left" aria-label="左侧方案"></select></h2><div class="viewport" id="lv"><img id="li" alt="左侧对照图"></div><div class="links"><a id="lf" target="_blank">打开原尺寸整页</a> · <a id="lc" target="_blank">打开局部图</a></div><div id="lm" class="metric hidden"></div></section>
<section class="panel"><h2>右：<select id="right" aria-label="右侧方案"></select></h2><div class="viewport" id="rv"><img id="ri" alt="右侧对照图"></div><div class="links"><a id="rf" target="_blank">打开原尺寸整页</a> · <a id="rc" target="_blank">打开局部图</a></div><div id="rm" class="metric hidden"></div></section>
</div>
<div class="note" id="note"></div>
<div class="review"><span>这一页的判断：</span> <button data-vote="left">左侧更好</button> <button data-vote="right">右侧更好</button> <button data-vote="similar">差不多</button> <button data-vote="unclear">还不能判断</button> <button id="export">导出我的记录 CSV</button><p class="small">记录只保存在当前浏览器本地，不上传。键盘 ← / → 切换照片。<a href="README.md">查看精选局部对照</a></p></div>
<script>
const DATA=__COMPARISON_DATA__;
const $=id=>document.getElementById(id);
let pages=DATA.pages.slice(),locked=false;
let votes={};try{votes=JSON.parse(localStorage.getItem('score_dewarp_comparison_votes')||'{}')}catch(e){}
for(const side of ['left','right'])for(const [key,name]of Object.entries(DATA.methods)){let o=new Option(name,key);$(side).add(o)}
$('left').value='traditional';$('right').value='document';
function options(keep){$('sample').replaceChildren();for(const p of pages)$('sample').add(new Option(p.sample,p.sample));if(pages.some(p=>p.sample===keep))$('sample').value=keep}
function voteKey(){return[$('sample').value,$('left').value,$('right').value,$('mode').value].join('|')}
function voteState(){for(const b of document.querySelectorAll('[data-vote]'))b.classList.toggle('selected',votes[voteKey()]?.vote===b.dataset.vote)}
function metric(m){const f=(x,n=3)=>x==null?'—':x.toFixed(n);return `平直度 ${f(m.straight)}（越低越好） · 谱线点覆盖 ${f(m.coverage*100,1)}% · 边缘墨迹代理 ${f(m.margin*100,1)}% · 翻折单元 ${m.fold==null?'—':f(m.fold*100)}% · 输出 ${m.size.join('×')}`}
function render(){const p=DATA.pages.find(p=>p.sample===$('sample').value);if(!p)return;for(const [side,prefix]of[['left','l'],['right','r']]){const key=$(side).value,m=p.methods[key];$(prefix+'i').src=m[$('mode').value];$(prefix+'i').alt=`${p.sample} ${DATA.methods[key]} ${$('mode').value==='crop'?'同位置局部':'整页'}`;$(prefix+'i').style.width=$('zoom').value+'%';$(prefix+'f').href=m.full;$(prefix+'c').href=m.crop;$(prefix+'m').textContent=metric(m);$(prefix+'m').classList.toggle('hidden',!$('metrics').checked);$(prefix+'v').scrollTop=0;$(prefix+'v').scrollLeft=0}
const learned=[$('left').value,$('right').value].some(x=>x.startsWith('network'));$('note').textContent=learned?'注意：网络分支展示原始实验输出，未启用 CLI 翻折回退。谱线变直后仍可能存在翻折或音符形变，不能只按平直度选方案。':'局部图只对应原图中的三个选定位置，不能证明整页内容完整。请切到整页检查上、下边缘；边缘墨迹比例是代理指标，可能把阴影或纸外背景算作内容。';history.replaceState(null,'','#'+p.sample);voteState()}
function move(d){let i=pages.findIndex(p=>p.sample===$('sample').value);$('sample').value=pages[(i+d+pages.length)%pages.length].sample;render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
for(const id of ['sample','left','right','mode','zoom','metrics'])$(id).onchange=render;
$('filter').onchange=()=>{const keep=$('sample').value;pages=DATA.pages.slice();switch($('filter').value){case'selected':pages=pages.filter(p=>DATA.selected.includes(p.sample));break;case'worst':pages.sort((a,b)=>b.delta-a.delta);break;case'largest':pages.sort((a,b)=>a.delta-b.delta);break;case'margin':pages.sort((a,b)=>Math.abs(b.methods.document.margin-b.methods.traditional.margin)-Math.abs(a.methods.document.margin-a.methods.traditional.margin));break}options(keep);if($('filter').value!=='all'&&$('filter').value!=='selected')$('sample').selectedIndex=0;render()};
for(const [a,b]of[['lv','rv'],['rv','lv']])$(a).addEventListener('scroll',()=>{if(locked||!$('sync').checked)return;locked=true;for(const axis of ['Top','Left']){const span=axis==='Top'?'Height':'Width';const total=$(a)['scroll'+span]-$(a)['client'+span];const other=$(b)['scroll'+span]-$(b)['client'+span];$(b)['scroll'+axis]=total>0?$(a)['scroll'+axis]/total*other:0}requestAnimationFrame(()=>locked=false)});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
for(const b of document.querySelectorAll('[data-vote]'))b.onclick=()=>{votes[voteKey()]={vote:b.dataset.vote,date:new Date().toISOString()};try{localStorage.setItem('score_dewarp_comparison_votes',JSON.stringify(votes))}catch(e){}voteState()};
$('export').onclick=()=>{let rows=['sample,left,right,mode,vote,date'];for(const[k,v]of Object.entries(votes))rows.push([...k.split('|'),v.vote,v.date].join(','));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='score_comparison_votes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
options(location.hash.slice(1));render();
</script>
</html>
